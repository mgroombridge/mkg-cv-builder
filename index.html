<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#185abd" />
  <meta name="description" content="MKG CV Builder helps job seekers create, save, preview and export polished CVs." />
  <title>MKG CV Builder</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div>
        <strong>MKG CV Builder</strong>
        <small>Build a polished CV, step by step</small>
      </div>
    </div>

    <nav class="top-nav" aria-label="Main navigation">
      <button class="nav-pill active" data-page="builder" type="button">Builder</button>
      <button class="nav-pill" data-page="dashboard" type="button">Dashboard</button>
      <button class="nav-pill" data-page="profile" type="button">Profile</button>
      <button class="nav-pill" data-page="jobs" type="button">Jobs</button>
      <button class="nav-pill disabled" data-page="cover" type="button" aria-disabled="true">Cover letters</button>
    </nav>

    <div class="header-actions">
      <span id="saveStatus" class="save-status" aria-live="polite">Saved locally</span>
      <button id="accountBtn" class="btn btn-secondary" type="button">Sign in</button>
      <button id="resetBtn" class="btn btn-ghost" type="button">Start again</button>
    </div>
  </header>

  <main id="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="accountDialog" class="confirm-dialog wide-dialog">
    <form method="dialog" class="account-form">
      <h2>Account</h2>
      <p class="muted">Create an account or sign in to save CVs, profile details and version history.</p>
      <div class="form-grid">
        <div class="field">
          <label for="authEmail">Email</label>
          <input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="authPassword">Password</label>
          <input id="authPassword" type="password" autocomplete="current-password" placeholder="At least 6 characters" />
        </div>
      </div>
      <div class="dialog-actions split">
        <button class="btn btn-secondary" value="cancel">Close</button>
        <span class="spacer"></span>
        <button id="signInBtn" class="btn btn-secondary" type="button">Sign in</button>
        <button id="signUpBtn" class="btn btn-primary" type="button">Create account</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirmDialog" class="confirm-dialog">
    <form method="dialog">
      <h2 id="confirmTitle">Confirm</h2>
      <p id="confirmMessage">Are you sure?</p>
      <div class="dialog-actions">
        <button class="btn btn-secondary" value="cancel">Cancel</button>
        <button id="confirmActionBtn" class="btn btn-danger" value="confirm">Confirm</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
